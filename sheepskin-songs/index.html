<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>《羊皮卷之歌》· 制作中</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
.card{max-width:520px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:18px;padding:36px 28px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.badge{display:inline-block;font-size:12px;letter-spacing:2px;color:#93c5fd;border:1px solid #3b82f6;border-radius:999px;padding:6px 14px;margin-bottom:20px}
h1{font-size:26px;line-height:1.4;margin-bottom:14px}
p{font-size:15px;line-height:1.9;color:#94a3b8}
.line{width:56px;height:2px;background:#3b82f6;margin:22px auto}
.tip{font-size:13px;color:#64748b;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="badge">熙祺智书 · 多媒体书</div>
  <h1>《羊皮卷之歌》</h1>
  <p>这本书正在按“六化”标准重做，公网阅读暂未开放。</p>
  <div class="line"></div>
  <p class="tip">返回熙祺智书平台，可阅读其余已上架书目。</p>
</div>
</body>
</html>
