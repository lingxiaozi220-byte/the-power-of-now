 {t:"序章 · 华尔街的百科全书",tag:["开篇","定义"],art:"art_cover.jpg",cap:"一本在废墟中写成的书，教你在任何市场活下去",voice:["voice_open.wav","序章导听 · 证券分析是什么"],

 {t:"第1课 · 分析的三层金字塔",tag:["方法","逻辑"],art:"art_pyramid.jpg",cap:"事实 → 分析 → 结论，一层都不能跳",

 {t:"第2课 · 投资与投机：一道分界线",tag:["认知","核心"],art:"art_divide.jpg",cap:"左边是分析台，右边是赌桌——你站哪边？",

  <p>一个人可以在买债券时投机，也可以在买股票时投资——区别不在品种，在方法：<b class="gold">有没有分析，有没有安全边际</b>。</p>`},
  flow:["理解：投机与否取决于方法","记忆：分析、安全、回报三条件","联想：我最近一次操作是投资还是投机","练习：投资投机判断"]},
 {t:"第3课 · 债券与优先股：契约优先权",tag:["固定收益","保障"],art:"art_bond.jpg",cap:"先还谁的钱，决定了谁更安全",

  <p>优先股比债券差一档：它的股息支付不是硬性义务，公司没钱可以停发。<b class="gold">所以买优先股，要用比债券更严的标准去衡量</b>。</p>

 {t:"第4课 · 资产负债表：家底清查",tag:["财报","安全"],art:"art_balance.jpg",cap:"先看家底，再看赚钱——资产是最后的防线",voice:["voice_balance.wav","第4课 · 财报分析：两张表看穿一家公司"],

  body:function(){return `<div class="mem">⚖️ 资产负债表三问：<br>

 {t:"第5课 · 损益表：盈利的真相",tag:["财报","盈利"],art:"art_income.jpg",cap:"利润不是一行数字，而是一条层层过滤的瀑布",
  lead:"资产负债表看家底，损益表看赚钱能力——两张表合起来，才是完整的公司。",
  body:function(){return `<div class="mem">💧 损益表瀑布：<br>
  🔹 收入 → 减营业成本 → 毛利 → 减费用 → 营业利润 → 减利息税 → 净利润<br>

  <p>格雷厄姆的名言：<b class="gold">一只股票值得买的理由，不是它今年赚得多，而是它未来很多年都能赚得稳</b>。</p>
  <p>练习：找一只股票，看它过去五年的净利润——是稳步增长，还是忽上忽下？</p>`},
  flow:["理解：盈利质量比单年利润重要","记忆：收入减成本减费用等于净利","联想：我买的公司利润稳吗","练习：盈利质量题"]},
 {t:"第6课 · 内在价值：称一称公司的重量",tag:["估值","核心"],art:"art_value2.jpg",cap:"内在价值不是一个点，而是一个区间",
  lead:"格雷厄姆发明了「内在价值」：证券的真实价值，不等于市场价格。",
  body:function(){return `<div class="video-box"><div class="lbl">🎬 第6课视频 · 现代股票估值与选股新标准（《证券分析》第28章解读）</div><iframe src="https://player.bilibili.com/player.html?bvid=BV1M89SBsEt7&page=1&high_quality=1&danmaku=0" allowfullscreen scrolling="no" loading="lazy"></iframe></div>
  <div class="mem">⚖️ 内在价值的真相：<br>

  <p>格雷厄姆的实用主义：<b class="gold">你不需要精确到小数点，只需要知道：当前价格，比合理区间高很多，还是低很多</b>。</p>

 {t:"第7课 · 安全边际：为错误留余地",tag:["安全边际","核心"],art:"art_margin2.jpg",cap:"你一定会犯错——安全边际就是为错误兜底的弹簧",voice:["voice_margin2.wav","第7课 · 安全边际：先不亏再谈赚"],

  <div class="mem">🛡️ 安全边际 = 内在价值 − 买入价格<br>

    if(g.type==="choice"){

function pick(gi,oi){
  var g=games[gi],o=g.opts[oi],feed=$("gf"+gi);

  btns.forEach(b=>{b.disabled=true;b.classList.remove("correct","wrong");});
  btns[oi].classList.add(o.r?"correct":"wrong");
  if(o.r){feed.className="gfeed ok";feed.textContent="✅ "+g.feed;earnBadge(gi);}
  else{feed.className="gfeed no";feed.textContent="❌ 再想想。提示："+g.feed;btns[g.opts.findIndex(x=>x.r===1)].classList.add("correct");}

$("btnGames").onclick=function(){var g=document.querySelector(".game");if(g)g.scrollIntoView({behavior:"smooth"});};
$("btnUnlock").onclick=function(){unlock();};
var bgm=new Audio("bgm.wav");bgm.loop=true;bgm.volume=0.35;
var bgmOn=false;
$("btnBgm").onclick=function(){
  if(!bgmOn){bgm.play().then(function(){bgmOn=true;$("btnBgm").textContent="🎵 关背景乐";toast("🎵 背景音乐已开启");}).catch(function(){toast("点击页面任意处后再试");});}
  else{bgm.pause();bgmOn=false;$("btnBgm").textContent="🎵 背景乐";toast("背景音乐已关闭");}
};
document.addEventListener("click",function(){if(bgmOn&&bgm.paused)bgm.play().catch(function(){});});
function toast(msg){var t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},1800);}

loadBadges();render();
track("view");
</script>
</body>
</html>
