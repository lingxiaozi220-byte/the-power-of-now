 {t:"序章 · 买得便宜，不如买得好",tag:["开篇","认知"],art:"art_cover.jpg",cap:"格雷厄姆教你避险，费雪教你赚钱",voice:["voice_open.wav","序章导听 · 巴菲特的另一半老师"],

 {t:"第1课 · 买股票 = 买公司",tag:["视角","本质"],art:"art_buy.jpg",cap:"你买的不是一张凭证，是一家公司的一部分",

  flow:["理解：股票是公司所有权","记忆：公司、产品、客户、未来","联想：我能一句话说清持仓公司卖什么吗","练习：所有者视角题"]},
 {t:"第2课 · 闲聊法：侦探式调研",tag:["调研","方法"],art:"art_talk.jpg",cap:"财报里听不到的真相，都在闲聊里",voice:["voice_talk.wav","第2课 · 闲聊法：怎么听到真话"],

  body:function(){return `<div class="video-box"><div class="lbl">🎬 第2课视频 · 费雪与成长股投资：闲聊法与管理层质量（译者胡恒博士访谈）</div><iframe src="https://player.bilibili.com/player.html?bvid=BV1k88wzvEve&page=1&high_quality=1&danmaku=0" allowfullscreen scrolling="no" loading="lazy"></iframe></div>

 {t:"第3课 · 十五要点（上）：生意与产品",tag:["选股","标准"],art:"art_market.jpg",cap:"先看市场有没有天花板，再看产品有没有护城河",

 {t:"第4课 · 十五要点（中）：管理层",tag:["管理层","诚信"],art:"art_manage.jpg",cap:"船往哪开，取决于船长是谁",

 {t:"第5课 · 十五要点（下）：财务与纪律",tag:["财务","纪律"],art:"art_profit.jpg",cap:"利润不是越多越好，而是越稳越好、越真越好",

  body:function(){return `<div class="mem">📈 十五要点 · 财务与纪律篇：<br>

  1️⃣3️⃣ 股本扩张：扩张靠自身盈利滚动，还是靠不断增发摊薄股东？<br>
  1️⃣4️⃣ 内部沟通：管理层对内部人讲话，和对股东一样诚实吗？<br>
  1️⃣5️⃣ 绝对诚信：管理层诚信毋庸置疑——<b class="gold">这是红线，一票否决</b>。</div>
  <p>费雪特别警惕一件事：<b class="gold">增发摊薄</b>。一家好公司如果总靠向股东要钱扩张，你的每一股价值都在被稀释。<b class="gold">优质成长股，应主要靠自身盈利滚动发展</b>。</p>

 {t:"第6课 · 何时买入：发现伟大公司的时机",tag:["时机","买入"],art:"art_timing.jpg",cap:"买入的最佳时机，是你真正看懂它的那一刻",

function renderGames(){
  for(var i=0;i<games.length;i++){
    var g=games[i], holder=$("sec"+g.sec);
    if(!holder) continue;
    var box=document.createElement("div");box.className="game";box.id="game"+i;
    box.innerHTML=`<h4>🎮 ${g.title}<span>游戏 ${i+1}/${games.length}</span></h4><div class="gq">${g.q}</div><div id="gg${i}"></div><div class="gfeed" id="gf${i}"></div><div class="badge-row" id="gb${i}"></div>`;
    holder.appendChild(box);
    var body=$("gg"+i);
    if(g.type==="choice"){
      g.opts.forEach((o,oi)=>{
        var b=document.createElement("button");b.className="gopt";b.textContent=o.t;
        b.onclick=function(){pick(i,oi)};
        body.appendChild(b);
      });
    }else if(g.type==="input"){
      var inp=document.createElement("input");inp.className="inp";inp.placeholder="输入你的答案…";
      var btn=document.createElement("button");btn.className="gbtn";btn.textContent="提交";
      btn.onclick=function(){checkInput(i,inp.value)};
      body.appendChild(inp);body.appendChild(btn);
    }
  }
}
function pick(gi,oi){
  var g=games[gi],o=g.opts[oi],feed=$("gf"+gi);
  var btns=$("gg"+gi).querySelectorAll(".gopt");
  btns.forEach(b=>{b.disabled=true;b.classList.remove("correct","wrong");});
  btns[oi].classList.add(o.r?"correct":"wrong");
  if(o.r){feed.className="gfeed ok";feed.textContent="✅ "+g.feed;earnBadge(gi);}
  else{feed.className="gfeed no";feed.textContent="❌ 再想想。提示："+g.feed;btns[g.opts.findIndex(x=>x.r===1)].classList.add("correct");}
}
function checkInput(gi,val){
  var g=games[gi],feed=$("gf"+gi);
  var v=(val||"").trim();
  if(v.indexOf(g.ans)>=0 || g.ans.indexOf(v)>=0){feed.className="gfeed ok";feed.textContent="✅ "+g.feed;earnBadge(gi);}
  else{feed.className="gfeed no";feed.textContent="❌ 答案约是 "+g.ans+"。再试试看。"}
}
function earnBadge(gi){
  var g=games[gi];
  if(!earned[gi]){earned[gi]=1;saveBadges();
    addPts(10);
    var bl=$("gb"+gi);if(bl)bl.innerHTML=`<span class="bdg earned">🏅 已通关 · +10积分</span>`;
    toast("🎮 通关「"+g.title+"」 +10积分");
    track("game",g.title);
  }
}
function isUnlocked(){
  try{return localStorage.getItem("xz_admin")==="1"||localStorage.getItem("xz_unlock_growth")==="1";}catch(e){return false}
}
function unlock(){
  var p=prompt("请输入管理员口令或激活码：");
  if(!p) return;
  if(p==="xiqi-admin-2026"){try{localStorage.setItem("xz_admin","1");localStorage.setItem("xz_unlock_growth","1");}catch(e){};render();toast("🔓 管理员权限已生效，全部解锁");return;}
  if(/^XQ2026/i.test(p)||/^[A-Z0-9]{8}$/.test(p)){try{localStorage.setItem("xz_unlock_growth","1");}catch(e){};render();toast("🔓 激活成功，全书已解锁");track("unlock",p);return;}
  toast("❌ 口令不正确");
}
function playV(src,el){
  var a=el.querySelector("audio");
  if(a){if(a.paused)a.play();else a.pause();return;}
  a=document.createElement("audio");a.src=src;a.controls=true;a.style.width="100%";a.style.marginTop="8px";
  el.appendChild(a);a.play();
  track("audio",src);
}
function loadPts(){
  var p=0;try{p=parseInt(localStorage.getItem("xz_points"))||0;}catch(e){}
  $("ptsBox").textContent=p;
}
function addPts(n){
  var p=0;try{p=parseInt(localStorage.getItem("xz_points"))||0;}catch(e){}
  p+=n;try{localStorage.setItem("xz_points",p);}catch(e){}
  $("ptsBox").textContent=p;track("points",String(n));
}
function updProg(){
  var h=document.documentElement.scrollHeight-innerHeight;
  $("prog").style.width=(innerHeight>h?100:(scrollY/h*100))+"%";
}
addEventListener("scroll",updProg);
function track(ev,val){
  try{
    var vid=localStorage.getItem("xiqi_vid")||("v_"+Date.now()+"_"+Math.random().toString(36).slice(2,8));
    localStorage.setItem("xiqi_vid",vid);
    fetch("https://4kyy5784jsu53.aiforce.cloud/openapi/reading-tracker/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vid:vid,event:ev,book:"growth",value:val||""})}).catch(function(){});
  }catch(e){}
}
function saveBadges(){try{localStorage.setItem("xz_badges_growth",JSON.stringify(earned));}catch(e){}}

$("btnToc").onclick=function(){scrollTo(0,0);};
$("btnVoice").onclick=function(){var v=document.querySelector(".voice");if(v)v.scrollIntoView({behavior:"smooth"});};
$("btnVideo").onclick=function(){var v=document.querySelector(".video-box");if(v)v.scrollIntoView({behavior:"smooth"});};
$("btnGames").onclick=function(){var g=document.querySelector(".game");if(g)g.scrollIntoView({behavior:"smooth"});};
$("btnUnlock").onclick=function(){unlock();};
var bgm=new Audio("bgm.wav");bgm.loop=true;bgm.volume=0.35;
var bgmOn=false;
$("btnBgm").onclick=function(){
  if(!bgmOn){bgm.play().then(function(){bgmOn=true;$("btnBgm").textContent="🎵 关背景乐";toast("🎵 背景音乐已开启");}).catch(function(){toast("点击页面任意处后再试");});}
  else{bgm.pause();bgmOn=false;$("btnBgm").textContent="🎵 背景乐";toast("背景音乐已关闭");}
};
document.addEventListener("click",function(){if(bgmOn&&bgm.paused)bgm.play().catch(function(){});});
function toast(msg){var t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none"},1800);}

loadBadges();render();
track("view");
</script>
</body>
