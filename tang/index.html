<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人教语文·唐诗多媒体书（三上·五上）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#faf6ec;--card:#fffdf6;--ink:#3a342a;--ink2:#7a7160;--line:#e6dfcd;--red:#b03a2e;--redd:#8f2d22;--gold:#b8860b;--green:#4a6b4a}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
header{position:sticky;top:0;z-index:50;background:rgba(250,246,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.hd{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.hd .logo{font-size:17px;font-weight:800;color:var(--red);white-space:nowrap}
.hd .logo small{display:block;font-size:10px;color:var(--ink2);font-weight:400}
.nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2);cursor:pointer}
.nav button.on{background:var(--red);color:#fff;border-color:var(--red)}
.sec{display:none;padding-top:16px}
.sec.on{display:block}
.hero{text-align:center;padding:34px 10px 26px}
.hero .t1{font-size:30px;font-weight:900;color:var(--red);letter-spacing:2px}
.hero .t2{font-size:14px;color:var(--ink2);margin-top:6px}
.hero .t3{margin-top:14px;font-size:13px;color:var(--gold)}
.progress{max-width:420px;margin:16px auto 0;background:#eee7d8;border-radius:999px;height:12px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red));border-radius:999px;transition:width .4s}
.cta{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.cta button{border:none;border-radius:14px;padding:14px 26px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(176,58,46,.25)}
.cta .g3{background:var(--red);color:#fff}
.cta .g5{background:#3f5d3f;color:#fff}
.section-title{font-size:20px;font-weight:800;margin:18px 0 4px;display:flex;align-items:center;gap:8px}
.section-sub{font-size:12.5px;color:var(--ink2);margin-bottom:14px}
.unit{margin:18px 0 6px;font-size:14px;font-weight:700;color:var(--redd);border-left:3px solid var(--red);padding-left:8px}
.poem-list{display:flex;flex-wrap:wrap;gap:10px}
.poem-item{flex:1 1 200px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
.poem-item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(58,52,42,.12)}
.poem-item img{width:100%;height:110px;object-fit:cover;display:block}
.poem-item .pi{padding:10px 12px}
.poem-item .pt{font-size:15px;font-weight:700}
.poem-item .pa{font-size:12px;color:var(--ink2)}
.poem-item .done{float:right;color:var(--red);font-size:13px}
.back{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink2);cursor:pointer;margin-bottom:10px}
.art{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(58,52,42,.18)}
.art img{width:100%;display:block}
.art .art-tag{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.art .play-ov{position:absolute;right:12px;bottom:12px;background:rgba(176,58,46,.92);color:#fff;border:none;border-radius:12px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer}
.poem-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.poem-title{text-align:center;font-size:22px;font-weight:900;letter-spacing:2px}
.poem-auth{text-align:center;font-size:13px;color:var(--ink2);margin-top:2px}
.poem-lines{text-align:center;font-size:20px;font-weight:700;line-height:2.1;letter-spacing:3px;margin-top:10px;color:#2f2a22}
.meaning{background:#f4eee0;border-radius:12px;padding:12px 14px;font-size:14px;color:#4c443a;margin-top:12px}
.meaning b{color:var(--red)}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.notes span{background:#f0e9d8;border-radius:999px;padding:3px 10px;font-size:12px;color:#6b614c}
.poet{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;color:#5c5446;background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.poet b{color:var(--gold);white-space:nowrap}
audio{width:100%;height:38px;margin-top:10px}
.game-box{background:#2c3a3a;border-radius:16px;padding:16px;margin-top:12px;color:#e8e2d2}
.game-box .gq{font-size:14.5px;font-weight:700;color:#f4d58a;margin-bottom:10px}
.gopts{display:flex;flex-wrap:wrap;gap:8px}
.gopts button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#e8e2d2;border-radius:10px;padding:9px 14px;font-size:13.5px;cursor:pointer;transition:.12s}
.gopts button:hover{background:rgba(255,255,255,.2)}
.gopts button.ok{background:#3f8f5f;border-color:#3f8f5f}
.gopts button.bad{background:#a04030;border-color:#a04030}
.gf{font-size:13px;margin-top:10px;min-height:20px;color:#cdc4ae}
.game-box.ord .gq{font-size:13px}
.order-slots{display:flex;flex-wrap:wrap;gap:6px;min-height:38px;margin-top:8px;border:1px dashed rgba(255,255,255,.3);border-radius:10px;padding:6px}
.order-slots span{background:#3f5d3f;color:#fff;border-radius:8px;padding:4px 10px;font-size:13px}
.order-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.order-pool button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#e8e2d2;border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer}
.order-pool button:disabled{opacity:.35;cursor:default}
.daka{display:flex;align-items:center;gap:10px;margin-top:14px}
.daka button{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#d4a24c,#b8860b);color:#fff;box-shadow:0 4px 12px rgba(184,134,11,.3)}
.daka button.on{background:linear-gradient(135deg,#4a8f5f,#3a7a50)}
.daka .pts{font-size:13px;color:var(--ink2)}
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.quiz-card .qt{font-size:15px;font-weight:700;margin-bottom:10px}
.quiz-card .qt i{font-style:normal;color:var(--red)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;opacity:.45;filter:grayscale(1)}
.ach.on{opacity:1;filter:none;box-shadow:0 4px 14px rgba(184,134,11,.2)}
.ach .ic{font-size:28px}
.ach .nm{font-size:13px;font-weight:700;margin-top:4px}
.ach .ds{font-size:11px;color:var(--ink2);margin-top:2px}
.pts-top{text-align:center;font-size:13px;color:var(--ink2);margin:10px 0}
.pts-top b{color:var(--red);font-size:18px}
.overlay{position:fixed;inset:0;background:#111;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
.overlay.on{display:flex}
.ov-stage{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;overflow:hidden;border-radius:14px}
.ov-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov-stage .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.62))}
.ov-line{position:absolute;left:0;right:0;bottom:18%;text-align:center;color:#fff;font-size:22px;font-weight:800;letter-spacing:4px;text-shadow:0 2px 12px rgba(0,0,0,.8);padding:0 14px;opacity:0;transform:translateY(10px);transition:.4s}
.ov-line.show{opacity:1;transform:none}
.ov-bar{width:100%;max-width:560px;height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:14px;overflow:hidden}
.ov-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:4px}
.ov-ctl{display:flex;gap:12px;margin-top:14px}
.ov-ctl button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:8px 18px;font-size:14px;cursor:pointer}
.ov-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;z-index:10}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(30,28,22,.92);color:#fff;padding:10px 20px;border-radius:999px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.lock-badge{position:absolute;top:8px;right:8px;background:rgba(176,58,46,.95);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;z-index:2}
.poem-item{position:relative}
.poem-item.locked img{filter:grayscale(.6) brightness(.88)}
.poem-item .lock-line{position:absolute;inset:0;background:rgba(250,246,236,.25);z-index:1}
.cu{background:#b8860b!important}
.wall{position:fixed;inset:0;background:rgba(20,16,8,.72);z-index:300;display:none;align-items:center;justify-content:center;padding:18px}
.wall.on{display:flex}
.wall-box{background:#fffdf6;border-radius:20px;max-width:400px;width:100%;padding:24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.wall-box .w-ic{font-size:40px}
.wall-box .w-t{font-size:20px;font-weight:900;color:#8f2d22;margin-top:8px}
.wall-box .w-d{font-size:13.5px;color:#7a7160;margin-top:8px;line-height:1.8}
.wall-box .w-price{font-size:30px;font-weight:900;color:#b8860b;margin:12px 0 2px}
.wall-box .w-price small{font-size:12px;color:#7a7160;font-weight:400}
.wall-box .w-btn{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#c94b3c,#8f2d22);color:#fff;margin-top:14px;box-shadow:0 6px 18px rgba(143,45,34,.3)}
.wall-box .w-code{margin-top:12px;text-align:left;border-top:1px dashed #e6dfcd;padding-top:12px}
.wall-box .w-code label{font-size:12px;color:#7a7160;display:block;margin-bottom:6px}
.wall-box .w-code input{width:100%;border:1px solid #e6dfcd;border-radius:10px;padding:11px 12px;font-size:15px;letter-spacing:2px;text-transform:uppercase;box-sizing:border-box}
.wall-box .w-code button{width:100%;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;background:#4a6b4a;color:#fff;margin-top:8px}
.wall-box .w-x{background:none;border:none;color:#7a7160;font-size:13px;cursor:pointer;margin-top:14px;text-decoration:underline}
.w-ok{font-size:13px;font-weight:700;margin-top:8px;min-height:20px;text-align:center}
.video-block{margin-top:12px;background:#2c3a3a;border-radius:16px;padding:12px}
.video-block .lbl{color:#f4d58a;font-size:13.5px;font-weight:700;margin-bottom:8px}
.video-block iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;background:#000;display:block}
.foot{text-align:center;font-size:12px;color:#a59c89;margin-top:30px}
@media(max-width:480px){.poem-lines{font-size:17px}.hero .t1{font-size:24px}}
</style>
</head>

 var g='';

 +'</div>';
}
function daka(id){var i=S.done.indexOf(id);if(i>=0){S.done.splice(i,1);S.pts=Math.max(0,S.pts-10);}else{S.done.push(id);S.pts+=10;}
 save();updateAch();var p=P.find(function(x){return x.id===id});var b=$('dk'+id);if(b){b.classList.toggle('on');b.textContent=S.done.indexOf(id)>=0?'✓ 已会背，太棒了':'📖 我已会背这首诗';}toast(S.done.indexOf(id)>=0?'🎉 背下一首！+10 分':'已取消背诵');}
function fillA(id,oi){var p=P.find(function(x){return x.id===id});if(S.games.indexOf(id)>=0)return;var g=$('g'+id),f=$('gf'+id);if(!g)return;var btns=g.querySelectorAll('.gopts button');if(!btns.length)return;
 btns.forEach(function(b){b.disabled=true});if(oi===p.game.a){btns[oi].classList.add('ok');f.innerHTML='✅ 答对啦！'+p.game.hint+'　+5 分';S.games.push(id);S.pts+=5;save();updateAch();}else{btns[oi].classList.add('bad');f.innerHTML='❌ 再想想：'+p.game.hint;}
 if(S.games.indexOf(id)>=0)setTimeout(function(){updateAch()},100);}
var ordPos={};
function ordPick(id,li){var p=P.find(function(x){return x.id===id});if(!ordPos[id])ordPos[id]=0;if(S.games.indexOf(id)>=0)return;
 var btn=document.querySelector('#op'+id+' button[data-i="'+li+'"]');if(!btn||btn.disabled)return;
 var exp=p.game.a[ordPos[id]];
 if(li===exp){btn.disabled=true;var slot=document.createElement('span');slot.textContent=p.lines[li];$('os'+id).appendChild(slot);ordPos[id]++;
  if(ordPos[id]===4){S.games.push(id);S.pts+=5;save();updateAch();$('gf'+id).innerHTML='✅ 排对啦！'+p.game.hint+'　+5 分';}
 }else{$('gf'+id).textContent='❌ 顺序不对，再试试～'+p.game.hint;}
}
var AC=[{ic:'📜',nm:'初入诗林',ds:'打开这本唐诗书'},{ic:'🖌',nm:'小小画家',ds:'看完任意 5 幅画'},{ic:'🎧',nm:'听读之星',ds:'听完任意 5 首朗读'},{ic:'🧩',nm:'游戏达人',ds:'完成 5 个互动游戏'},{ic:'🌟',nm:'三上小诗仙',ds:'背完三年级 9 首'},{ic:'🌙',nm:'五上小词人',ds:'背完五年级 11 首'},{ic:'🔥',nm:'背书达人',ds:'累计背满 10 首'},{ic:'🏆',nm:'满腹诗书',ds:'20 首全部会背'},{ic:'🎯',nm:'闯关王',ds:'两套测验全部答对'}];
function updateAch(){var lv=0;AC.forEach(function(a,i){var on=false;
 if(i===0)on=true;
 if(i===1)on=(S.games.length>=5||S.done.length>=5);
 if(i===2)on=(S.done.length>=5);
 if(i===3)on=S.games.length>=5;
 if(i===4)on=P.filter(function(p){return p.grade==='三上'&&S.done.indexOf(p.id)>=0}).length>=9;
 if(i===5)on=P.filter(function(p){return p.grade==='五上'&&S.done.indexOf(p.id)>=0}).length>=11;
 if(i===6)on=S.done.length>=10;
 if(i===7)on=S.done.length>=20;
 if(i===8)on=S.quiz.length>=10;
 if(on)lv++;
});S.lv=lv;save();}
function renderAch(){var h='<button class="back" onclick="tab(&quot;home&quot;)">← 返回首页</button><div class="section-title">🏅 我的成就墙</div><div class="section-sub">已点亮 <b style="color:var(--red)">'+S.lv+'</b> / '+AC.length+' 枚徽章 · 当前积分 <b style="color:var(--red)">'+S.pts+'</b></div><div class="ach-grid">';
 AC.forEach(function(a,i){var on=false;
 if(i===0)on=true;
 if(i===1)on=(S.games.length>=5||S.done.length>=5);
 if(i===2)on=(S.done.length>=5);
 if(i===3)on=S.games.length>=5;
 if(i===4)on=P.filter(function(p){return p.grade==='三上'&&S.done.indexOf(p.id)>=0}).length>=9;
 if(i===5)on=P.filter(function(p){return p.grade==='五上'&&S.done.indexOf(p.id)>=0}).length>=11;
 if(i===6)on=S.done.length>=10;
 if(i===7)on=S.done.length>=20;
 if(i===8)on=S.quiz.length>=10;
 h+='<div class="ach'+(on?' on':'')+'"><div class="ic">'+a.ic+'</div><div class="nm">'+a.nm+'</div><div class="ds">'+a.ds+'</div></div>';});
 $('app').innerHTML=h+'</div><div class="foot">熙祺智书 · 唐诗多媒体书 ｜ 每首诗原创插画与朗读，课文为公版经典，可放心学习</div>';}
function renderQuiz(){var h='<button class="back" onclick="tab(&quot;home&quot;)">← 返回首页</button><div class="section-title">🎯 闯关测验</div><div class="section-sub">每册 5 题，每题 10 分 · 全部答对点亮"闯关王"</div><div class="section-title" style="font-size:17px">📖 三年级上册 · 小测验</div>';
 QG3.forEach(function(q,i){var key='g3-'+i;var done=S.quiz.indexOf(key)>=0;h+='<div class="quiz-card"><div class="qt"><i>Q'+(i+1)+'.</i> '+q[0]+'</div><div class="gopts">'+q[1].map(function(o,j){var cls='';if(done&&j===q[2])cls=' ok';if(done&&S.quiz.indexOf(key)>=0&&S.quizR&&S.quizR.indexOf(key+'-'+j)>=0)cls=' bad';return '<button id="qk'+key+'-'+j+'" class="'+cls+'" onclick="quizA(&quot;'+key+'&quot;,'+j+','+q[2]+')">'+o+'</button>'}).join('')+'</div></div>';});
 h+='<div class="section-title" style="font-size:17px">📗 五年级上册 · 小测验</div>';
 QG5.forEach(function(q,i){var key='g5-'+i;var done=S.quiz.indexOf(key)>=0;h+='<div class="quiz-card"><div class="qt"><i>Q'+(i+1)+'.</i> '+q[0]+'</div><div class="gopts">'+q[1].map(function(o,j){var cls='';if(done&&j===q[2])cls=' ok';return '<button id="qk'+key+'-'+j+'" class="'+cls+'" onclick="quizA(&quot;'+key+'&quot;,'+j+','+q[2]+')">'+o+'</button>'}).join('')+'</div></div>';});
 $('app').innerHTML=h;}
function quizA(key,oi,ans){if(S.quiz.indexOf(key)>=0)return;var btns=document.querySelectorAll('#qk'+key+'-'+(0)+',#qk'+key+'-1,#qk'+key+'-2,#qk'+key+'-3');btns.forEach(function(b){b.disabled=true});
 if(oi===ans){$('qk'+key+'-'+oi).classList.add('ok');S.quiz.push(key);S.pts+=10;toast('✅ 答对！+10 分');}else{$('qk'+key+'-'+oi).classList.add('bad');$('qk'+key+'-'+ans).classList.add('ok');toast('正确答案已标出');}
 save();updateAch();}
var ovId=null,ovT=null,ovInt=null,ovLine=0;
function ovOpen(id){var p=P.find(function(x){return x.id===id});ovId=id;ovLine=0;
 var stage=$('ovStage');stage.innerHTML='<img src="'+p.img+'"><div class="shade"></div>'+p.lines.map(function(l){return '<div class="ov-line">'+l+'</div>'}).join('');
 $('ovBar').style.width='0';$('ov').classList.add('on');$('ovBtn').textContent='⏸ 暂停';
 var aud=new Audio(''+p.audio);ovT=aud;
 aud.ontimeupdate=function(){var d=aud.duration||1;$('ovBar').style.width=(aud.currentTime/d*100)+'%';
  var seg=Math.floor(aud.currentTime/(d/p.lines.length));if(seg>=p.lines.length)seg=p.lines.length-1;
  if(seg!==ovLine){ovLine=seg;var ls=stage.querySelectorAll('.ov-line');ls.forEach(function(x,i){x.classList.toggle('show',i===ovLine)})}};
 aud.onended=function(){ovClose();toast('🎉 听完了，试试背诵吧！');};
 aud.play().then(function(){ovInt=setInterval(function(){var ls=stage.querySelectorAll('.ov-line');if(ovLine<ls.length)ls[ovLine].classList.add('show')},150)}).catch(function(){toast('点击屏幕上的播放按钮开启声音')});}
function ovToggle(){if(!ovT)return;if(ovT.paused){ovT.play();$('ovBtn').textContent='⏸ 暂停';}else{ovT.pause();$('ovBtn').textContent='▶ 继续';}}
function ovClose(){if(ovT){ovT.pause();ovT=null;}clearInterval(ovInt);$('ov').classList.remove('on');toast('已回到诗文页，试着背一背吧');}
function boot(){if(!S.done)S.done=[];if(!S.games)S.games=[];if(!S.quiz)S.quiz=[];if(!S.quizR)S.quizR=[];updateAch();renderHome();tryOnlineUnlock();}
document.addEventListener('DOMContentLoaded',boot);
</script>




<script>
/* 熙祺智书 · 阅读埋点 v2（view/chapter_read/finish，fetch+img兜底） */
(function(){try{
var BK='tang',SEL='.poem-card',FIN='last';
var API='https://4kyy5784jsu53.aiforce.cloud/openapi/reading-tracker/track';
var vid=localStorage.getItem('xiqi_vid');
if(!vid){vid='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);});try{localStorage.setItem('xiqi_vid',vid);}catch(e){}}
var last=0;
function beacon(ev,ch){try{var q='?bookKey='+encodeURIComponent(BK)+'&eventType='+encodeURIComponent(ev)+'&chapterId='+encodeURIComponent(ch||'')+'&visitorId='+encodeURIComponent(vid);var img=new Image();img.src=API+q;}catch(e){}}
function track(ev,ch){var n=Date.now();if(n-last<5000)return;last=n;try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookKey:BK,eventType:ev,chapterId:ch||'',visitorId:vid}),keepalive:true}).catch(function(){beacon(ev,ch);});}catch(e){beacon(ev,ch);}}
track('view');
setInterval(function(){track('view');},30000);
function hook(){
  var els=[].slice.call(document.querySelectorAll(SEL));
  var done={},firedFin=false;
  if(!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(en){
      if(!en.isIntersecting)return;
      var el=en.target,id=el.id||'';
      if(id&&!done[id]&&!id.match(/^(wall|finalQuiz|finalQuiz2|fin)$/)){done[id]=1;track('chapter_read',id);}
      var isLast=(FIN==='last')&&(el===els[els.length-1]);
      var isFin=(FIN!=='last')&&el.matches(FIN);
      if((isLast||isFin)&&!firedFin){firedFin=true;track('finish');}
    });
  },{threshold:0.25});
  els.forEach(function(el){io.observe(el);});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',hook);else hook();
}catch(e){}})();
</script>
